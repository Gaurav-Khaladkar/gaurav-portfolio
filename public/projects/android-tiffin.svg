      <stop offset="0%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#tiffinBg)" />
  <!-- Smartphone Frame -->
  <rect x="310" y="50" width="180" height="350" rx="24" fill="#111827" stroke="#38bdf8" stroke-width="3" />
  <rect x="325" y="80" width="150" height="290" rx="8" fill="#1e293b" />
  <circle cx="400" cy="65" r="4" fill="#64748b" />
  <!-- Food delivery UI elements -->
  <rect x="340" y="100" width="120" height="24" rx="4" fill="#38bdf8" opacity="0.3" />
  <rect x="340" y="140" width="120" height="60" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <rect x="340" y="215" width="120" height="60" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <rect x="340" y="295" width="120" height="30" rx="6" fill="#10b981" />
  <text x="400" y="315" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">Order Tiffin</text>
  <!-- Title Badge -->
  <text x="50" y="70" font-family="sans-serif" font-size="20" fill="#f8fafc" font-weight="bold">Tiffin Service Android App</text>
  <text x="50" y="95" font-family="monospace" font-size="13" fill="#38bdf8">Subscription &amp; Meal Dispatch</text>
</svg>
